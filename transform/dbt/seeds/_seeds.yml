version: 2

seeds:

  - name: basket_relevance
    description: >
      Per-basket-line rules for deciding whether a search hit is actually the
      good the line asks for.

      Deliberately sparse: a rule is added only where the collected data shows a
      retailer's search returning something that is not the product. Both rule
      types test product IDENTITY and neither looks at the price, because a
      price-based filter would quietly discard real price movement, which is the
      one thing this project exists to measure.

      A line with a rule also stops being capped at the top five search hits.
      The cap is a crude stand-in for relevance, and it is what broke on
      2026-08-18: Woolworths' marketplace listings pushed the only real carton
      of eggs from rank five to rank six and it left the basket. A line that can
      say what it is looking for does not need to guess that it is near the top.
    config:
      column_types:
        search_term: varchar
        must_match: varchar
        require_unit_basis: varchar
        note: varchar
    columns:
      - name: search_term
        description: Basket line this rule applies to. Must exist in seeds/basket.csv.
        data_tests:
          - not_null
          - unique
      - name: must_match
        description: >
          Optional lowercase regex the product name must match. Backslash-free,
          per the rule in macros/cross_db.sql.
      - name: require_unit_basis
        description: >
          Optional unit-price basis the product must carry, as computed in
          stg_prices. Food lines are sold by weight or volume; the marketplace
          hardware that pollutes the same search results is priced per each or
          carries no unit price at all, so this separates them structurally
          rather than by keyword.
        data_tests:
          - accepted_values:
              arguments:
                values: ['per_100g', 'per_100ml', 'per_each']
      - name: note
        description: Why the rule exists, and what was observed that prompted it.

  - name: buckets
    description: >
      The pre-registered bucket assignment: 80 items, 40 price-visible and 40
      price-opaque, each with a name-match pattern and the rationale for its
      tier. Registered by the commit that added this file, before any
      bucket-level figure was computed — see docs/preregistration.md.

      This seed is evidence, not configuration. It is not edited to improve a
      result; a pattern may be corrected only for a demonstrable coverage fault,
      in its own commit, stating what was wrong.

      Known limit, found before registering and recorded in the doc: the
      price-opaque half matches only three pairs in the backfill, because a
      cross-retailer pair needs the product at both chains and the long tail is
      barely stocked in that source. The opaque half is registered for Arm B,
      which can be pointed at those lines deliberately.
    config:
      column_types:
        item_key: varchar
        bucket: varchar
        aisle: varchar
        match_pattern: varchar
        rationale: varchar
    # The 40-and-40 assertion is a singular test, tests/assert_buckets_forty_forty.sql
    # — a bucket that quietly grows or shrinks after registration is exactly the
    # failure this seed exists to make impossible.
    columns:
      - name: item_key
        description: Stable identifier for the item. Never reused for a different product.
        data_tests: [not_null, unique]
      - name: bucket
        description: The registered tier. Assigned before any price was looked at.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['price_visible', 'price_opaque']
      - name: aisle
        description: Grouping within the tier. Produce and packaged staples are analysed separately.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['produce', 'dairy', 'bakery', 'pantry', 'meat', 'frozen', 'drinks',
                         'household', 'baby', 'health', 'pet', 'occasion']
      - name: match_pattern
        description: >
          Lowercase substring a product name must contain. Backslash-free, per
          the rule in macros/cross_db.sql, so one literal works on both engines.
        data_tests: [not_null, unique]
      - name: rationale
        description: Why this item sits in this tier. Written before measurement.
        data_tests: [not_null]

  - name: basket
    description: >
      The collection basket: what ingest/fetch_prices.py asks both retailers for
      every morning. Moved here from seeds/basket.csv in v3 so that the
      collector and the warehouse read one file rather than two copies that can
      drift -- int_day_coverage and mart_basket both need to know which panel a
      line belongs to, and inferring it from the data is what let a denominator
      move under a published figure.

      Two panels. `everyday` is the original 50 lines and the only panel that
      decides whether a day is complete or enters the published basket total.
      `tail` is the 40 long-tail lines added for the pre-registered bucket test
      (docs/preregistration.md) -- thinly stocked, exploratory, and deliberately
      unable to invalidate a day of milk and bread prices by going out of stock.
    config:
      column_types:
        search_term: varchar
        category: varchar
        panel: varchar
    columns:
      - name: search_term
        description: Sent verbatim to both retailers' search endpoints.
        data_tests: [not_null, unique]
      - name: category
        data_tests: [not_null]
      - name: panel
        description: Which panel the line belongs to. Only `everyday` gates completeness.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['everyday', 'tail']
