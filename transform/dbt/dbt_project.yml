name: 'wow_vs_coles'
version: '2.0.0'
config-version: 2

profile: 'wow_vs_coles'

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

# Every model is a physical table. The warehouse file is small (a few MB) and
# the dashboard builder queries it directly with plain SQL, so views would only
# push the work to read time for no benefit.
#
# No per-layer schemas: everything lands in the target's one schema (`main` on
# DuckDB, $SNOWFLAKE_SCHEMA on Snowflake). The dashboard builder and the matcher
# both query the warehouse with unqualified table names, and one schema keeps
# that true on both engines.
models:
  wow_vs_coles:
    +materialized: table

snapshots:
  wow_vs_coles:
    +target_schema: "{{ target.schema }}"

vars:
  # Set by run_pipeline.py when replaying a historical day into the SCD2
  # snapshot. Empty means "today's run, use the latest observed day".
  snapshot_as_of: ''

  # v3 Arm A. Two different dates, and conflating them was a real bug.
  #
  # backfill_start is the ANALYSIS WINDOW: the left edge of the series the marts
  # build. It is now the first day the upstream source holds, so every pair
  # contributes every day of history it actually has. int_backfill_pair_daily
  # opens each pair at its own history_start, so a wide window costs build time
  # and nothing else.
  #
  # backfill_min_history is ELIGIBILITY: a product must have been observed by
  # this date to be matchable at all, which is how "at least a year of history"
  # is enforced. It is NOT the window.
  #
  # Passing one date to both is what made widening look ruinous. Requiring every
  # pair to span a 3-year window left 67 pairs out of 1,523, because the upstream
  # source only grew its own coverage over time. Separated, the same 1,523 pairs
  # carry a mean of 508 days each rather than 366, and 773,895 pair-days rather
  # than 557,418.
  backfill_start: '2023-09-26'
  backfill_min_history: '2025-08-27'
