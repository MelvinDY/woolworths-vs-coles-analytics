version: 2

sources:

  - name: raw
    description: >
      Landed price snapshots. `ingest/load_raw.py` loads every
      data/raw/prices_*.csv into one table in the target warehouse before dbt
      runs — CSVs are read directly on DuckDB and would not be reachable at all
      from Snowflake, so the load is the one step that is Python's job on both
      engines rather than dbt's.
    schema: "{{ target.schema }}"

    tables:
      - name: raw_prices
        description: One row per (retailer, product_id, search_term, snapshot_date). Immutable once written.
        config:
          loaded_at_field: fetched_at
          freshness:
            # The collector runs daily from a Windows scheduled task. 36 h means
            # one missed morning is loud; 96 h means a long weekend of downtime
            # fails the check rather than merely warning. A snapshot cannot be
            # backfilled, so a stale collector is the most expensive silent
            # failure this project has.
            warn_after: {count: 36, period: hour}
            error_after: {count: 96, period: hour}
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [retailer, product_id, search_term, snapshot_date]
        columns:
          - name: retailer
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['woolworths', 'coles']
          - name: product_id
            data_tests: [not_null]
          - name: price
            description: Shelf price on the day. Rows with no usable price are dropped in staging, not here.
          - name: snapshot_date
            data_tests: [not_null]
          - name: fetched_at
            description: UTC timestamp the row was pulled. Drives the source freshness check.
            data_tests: [not_null]

      - name: raw_hotprices
        description: >
          v3 Arm A. The Hot Prices AU canonical dumps, unpacked by
          ingest/load_hotprices.py. One row per observed PRICE CHANGE, not per
          day — the upstream format stores only the dates a price moved, which
          is why ~780k rows cover three years of 44k products.

          No freshness check. This is somebody else's series on somebody else's
          schedule, and a stale dump is a fact about them, not a failure of this
          collector. The freshness that matters is on raw_prices above.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [retailer, product_id, change_date]
        columns:
          - name: retailer
            description: Mapped from Hot Prices' 'woolies'/'coles' at load time.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['woolworths', 'coles']
          - name: product_id
            description: >
              The retailer's own product id — the same id space this project
              collects, which is what makes PRD-v3 FR-3 a join rather than a
              second matching problem.
            data_tests: [not_null]
          - name: change_date
            description: Date the price changed to this value.
            data_tests: [not_null]
          - name: price
            data_tests: [not_null]
          - name: fetched_date
            description: >
              Date this project downloaded the dump. Dates the product
              attributes, and bounds how far the last price window may be
              carried forward.
            data_tests: [not_null]
          - name: source_url
            description: Where the row came from. Provenance travels with the data.
            data_tests: [not_null]

  - name: matching
    description: >
      Output of the Python entity-resolution step (matching/match_products.py).
      It is a source rather than a model because rapidfuzz has no SQL
      equivalent and dbt does not build it — declaring it honestly as a source
      keeps the lineage graph true instead of pretending dbt owns the table.
    schema: "{{ target.schema }}"

    tables:
      - name: matched_pairs
        description: One row per accepted cross-retailer pair per snapshot day, with match tier and score.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [wow_product_id, coles_product_id, snapshot_date]
        columns:
          - name: match_type
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['national_brand', 'own_brand']
          - name: name_score
            data_tests: [not_null]

      - name: backfill_pairs
        description: >
          v3 Arm A pair identity, written by matching/match_backfill.py. Two
          pair sets live here side by side and pair_set is part of the grain:
          'v2_extended' pairs were accepted by v2's matcher on a retailer brand
          field and a search-term block, 'wide' pairs by a name-prefix brand
          proxy and a size bucket. They are not the same quality of evidence,
          they may cover the same products, and that overlap is deliberate —
          it is how the weaker derivation gets graded (PRD-v3 FR-4).
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [pair_set, wow_product_id, coles_product_id]
        columns:
          - name: pair_set
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['v2_extended', 'wide']
          - name: brand_tier
            description: >
              Store brand or name brand. Never pooled downstream — see
              matching/brands.py for why the two are different questions.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['national_brand', 'own_brand']
          - name: brand_tier_basis
            description: How the tier was decided, since the two pair sets do not decide it the same way.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['retailer_brand_field', 'derived_from_name']
          - name: history_start
            description: Later of the two products' first observed change points. The pair's series cannot open before it.
            data_tests: [not_null]
