version: 2

models:

  - name: int_product_prices_daily
    description: >
      The product-level daily price series: one row per (retailer, product_id,
      snapshot_date). Everything that reasons about time reads this, not
      stg_prices.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [retailer, product_id, snapshot_date]
    columns:
      - name: price
        data_tests: [not_null]
      - name: snapshot_date
        data_tests: [not_null]

  - name: int_day_coverage
    description: >
      Per-day basket coverage, and the is_complete_day flag the basket mart
      filters on. Exists because 2026-08-22 was written as a normal day with
      three of fifty Coles lines on it; see docs/data_quality.md.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date]
    columns:
      - name: snapshot_date
        data_tests: [not_null]
      - name: coverage_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: is_complete_day
        data_tests: [not_null]

  - name: int_matched_products
    description: Accepted cross-retailer pairs, one row per pair per day, from the Python matcher.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [wow_product_id, coles_product_id, snapshot_date]
    columns:
      - name: wow_price
        data_tests: [not_null]
      - name: coles_price
        data_tests: [not_null]
      - name: match_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['national_brand', 'own_brand']

  - name: int_matched_pairs
    description: >
      Pair identity across the whole series — one row per pair, ever, with a
      stable surrogate pair_id and the window of days it was matched on.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [wow_product_id, coles_product_id]
    columns:
      - name: pair_id
        data_tests: [not_null, unique]
      - name: first_matched_date
        data_tests: [not_null]
      - name: days_matched
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

  - name: int_backfill_pair_daily
    description: >
      v3 Arm A. Matched-pair prices for every day in the backfill window, with
      the gap, the parity flag and the brand tier on the grain. The Arm A
      counterpart to mart_price_history; pair_set is part of the key so the two
      pair sets can never be pooled by accident (PRD-v3 G5).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pair_set, pair_id, price_date]
      # The parity flag and the gap must agree. If a row is at parity the gap is
      # zero, and if they ever disagree one of the two is being computed wrong.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs_gap_pct is null or is_parity = (abs_gap_pct < 0.01)"
      # A gap day carries no prices, and a non-gap day carries both. This is the
      # v2 rule (a gap is a gap) asserted rather than merely intended.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_gap_day = (wow_price is null or coles_price is null)"
    columns:
      - name: pair_set
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['v2_extended', 'wide']
      - name: brand_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['national_brand', 'own_brand']
      - name: price_date
        data_tests: [not_null]
      - name: abs_gap_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
